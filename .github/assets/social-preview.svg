    <text x="280" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#4ade80">极速原位注入</text>
    <text x="280" y="52" font-family="sans-serif" font-size="13" fill="#cbd5e1">&lt;50ms 零进程中断体验</text>

    <!-- Badge 3 -->
    <rect x="520" y="0" width="240" height="70" rx="14" fill="url(#badgeGrad1)" stroke="#334155" stroke-width="1.5"/>
    <text x="540" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#fbbf24">103/103 全绿</text>
    <text x="540" y="52" font-family="sans-serif" font-size="13" fill="#cbd5e1">工业级高对抗全矩阵 CI</text>

    <!-- Badge 4 -->
    <rect x="780" y="0" width="240" height="70" rx="14" fill="url(#badgeGrad1)" stroke="#334155" stroke-width="1.5"/>
    <text x="800" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#c084fc">跨版本高韧性</text>
    <text x="800" y="52" font-family="sans-serif" font-size="13" fill="#cbd5e1">Win / macOS / Linux 通用</text>
