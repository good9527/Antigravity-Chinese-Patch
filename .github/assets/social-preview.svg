  <!-- Title & Subtitle -->
  <text x="220" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="1">
    Google Antigravity <tspan fill="url(#textGrad)">汉化补丁</tspan>
  </text>
  <text x="220" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
    PERMANENT CHINESE LOCALIZATION &amp; SELF-HEALING ARCHITECTURE
  </text>

  <!-- Core Value Proposition -->
  <text x="100" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#f1f5f9">
    🚀 真正永久自愈 · 深度无死角汉化 · 官方更新零感跟随
  </text>
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    独创四级自愈引擎（ASAR内存原位流式注入 + 官方更新实时劫持 + 毫秒级持久守卫 + 离线降级容灾）
  </text>

  <!-- Badges Row -->
  <g transform="translate(100, 410)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="240" height="70" rx="14" fill="url(#badgeGrad1)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">100% 覆盖率</text>
    <text x="20" y="52" font-family="sans-serif" font-size="13" fill="#cbd5e1">动态额度/计时/模型用量</text>

    <!-- Badge 2 -->
