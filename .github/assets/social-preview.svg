<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Tech Grid Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M0,80 H1280 M0,160 H1280 M0,240 H1280 M0,320 H1280 M0,400 H1280 M0,480 H1280 M0,560 H1280"/>
    <path d="M160,0 V640 M320,0 V640 M480,0 V640 M640,0 V640 M800,0 V640 M960,0 V640 M1120,0 V640"/>
  </g>

  <!-- Glowing Accent Orbs -->
  <circle cx="1120" cy="160" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="160" cy="480" r="140" fill="#3b82f6" opacity="0.10" filter="url(#glow)"/>

  <!-- Logo Icon Container -->
  <g transform="translate(100, 110)">
    <rect width="96" height="96" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <path d="M48,22 L72,68 L24,68 Z" fill="none" stroke="url(#textGrad)" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="48" cy="48" r="6" fill="#00f2fe"/>
